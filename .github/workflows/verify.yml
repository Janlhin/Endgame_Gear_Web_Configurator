# 权威判定通道。
#
# 为什么要 CI：本地门禁可以被绕过、可以被环境污染，只有干净环境下的结论才算数
# （见 AGENTS.md 与规范 §四层防御模型）。本项目目前的校验通道：
#
#   L1 静态    编辑器 / tsc（strict 全开）
#   L2 本地    npm run verify（提交前，人工执行）
#   L3 流水线  本文件 —— 权威判定
#   L4 运行期  浏览器控制台（无头 Edge 冒烟）+ 写入后的回读校验
#
# 2026-11-07：全部 run 步骤改为 pwsh（规范 §脚本执行基线）。原先依赖默认 bash 的
# 两段（grep 查产物、grep 查提交信息）已用 Select-String 重写，语义不变。
#
# 文档校验：markdownlint-cli2 已接入 verify:ci，配置见 .markdownlint-cli2.jsonc
# 与 docs/.markdownlint.jsonc。外部链接可达性**未**接入——markdown-link-check 在本机
# 网络下会把真实存在的仓库判为死链（504/403），详见 MANIFEST.md 的复核记录。
#
# 拆成两个 job 的原因：check:ui 依赖 **Windows 上预装的 msedge.exe** 与 python
# （re/*.py 里是无头浏览器演练），在 ubuntu runner 上跑不了。跨平台部分放 ubuntu，
# 需要浏览器的部分放 windows —— 两者都跑，互不豁免。
name: verify

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  # ---------- 跨平台：类型 / 断言 / i18n / 构建产物 ----------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # 必须 npm ci（锁文件精确还原），不用 npm install（可能静默升级）
      - run: npm ci
      # 与本地 verify 同一入口的跨平台子集（本地 verify 额外含 Windows-only 的 check:ui）
      - name: 跨平台校验（check / test / check:i18n / build）
        run: npm run verify:ci
      - name: 产物不得含绝对路径或本地残留
        run: |
          # build.mjs 内部已断言"无绝对路径"；这里再从外部独立验证一次（冗余校验的思路：
          # 同一类缺陷要有两条不共享实现的拦截路径）
          $abs = Select-String -Path index.html -Pattern '[A-Za-z]:\\\\|/Users/|/home/'
          if ($abs) {
            Write-Host "✗ 产物里出现绝对路径"
            $abs | ForEach-Object { Write-Host $_ }
            exit 1
          }
          $checklist = Select-String -Path index.html -Pattern 'cardChecklist' -SimpleMatch
          if (-not $checklist) {
            Write-Host "✗ 清单卡没渲染进产物（md2html 失效）"
            exit 1
          }
          Write-Host "✓ 产物检查通过"
      - name: 提交信息符合 Conventional Commits
        run: |
          # 只校验最近一次提交；历史不追溯，避免阻塞旧提交
          $subject = (git log -1 --pretty=%s)
          if ($subject -notmatch '^(feat|fix|docs|refactor|chore|perf|test|build|ci)(\(.+\))?: .+') {
            Write-Host "✗ 提交信息不符合 Conventional Commits：$subject"
            exit 1
          }
          Write-Host "✓ commit message ok"

  # ---------- Windows：需要真实浏览器的 UI 演练 ----------
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # ★ Windows runner 默认控制台编码是 GBK(charmap)，而脚本会打印中 / 日 / 韩文断言结果
      # （zh-TW「網頁版配置器」、ja「コンフィギュレーター」…），首次 CI 运行实测报
      # UnicodeEncodeError。本机之所以没暴露：控制台代码页与 runner 不同。
      # 修法是强制 Python 用 UTF-8 输出——只改 runner 环境，不动脚本逻辑。
      - name: UI 演练（无头 Edge，UTF-8 输出）
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python re/layout_check.py
          python re/i18n_check.py
          python re/render_check.py
          python re/reset_check.py
